name: Sync Upstream

on:
  schedule:
    # Check for new upstream commits every hour at minute 17.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web-design
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/lnkiai/m3e-canvas.git
          git fetch --no-tags upstream main

      - name: Check for upstream updates
        id: check
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "web-design already contains upstream/main."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New upstream commits detected."
          fi

      - name: Merge upstream safely
        if: steps.check.outputs.changed == 'true'
        shell: bash
        run: |
          set +e
          git merge upstream/main --no-edit
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicted="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicted" | grep -Ev '^(package.json|package-lock.json)$' || true)"

            if [ -n "$unexpected" ]; then
              echo "Merge conflicts require manual review:"
              printf '%s\n' "$unexpected"
              git merge --abort
              exit 1
            fi

            git checkout --theirs -- package.json package-lock.json
            git add package.json package-lock.json
          fi

          npm pkg set name="web-design"
          npm pkg set repository.type="git"
          npm pkg set repository.url="https://github.com/nhwin304/web-design.git"
          npm pkg set homepage="https://nhwin304.github.io/web-design/"
          npm install --package-lock-only --ignore-scripts
          git add package.json package-lock.json

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          elif ! git diff --cached --quiet; then
            git commit -m "chore: preserve web-design metadata"
          fi

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.check.outputs.changed == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.check.outputs.changed == 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.changed == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io

      - name: Push updated main
        if: steps.check.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Deploy updated site
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
