name: Sync Upstream

on:
  schedule:
    # Check for a new upstream revision every hour at minute 17.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    # A branch update must never sync or push changes directly to main.
    branches:
      - main
    paths:
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    # Defense in depth: only main may perform a write-enabled upstream sync.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web-design
        uses: actions/checkout@v7
        with:
          path: web-design
          fetch-depth: 0

      - name: Checkout m3e-canvas
        uses: actions/checkout@v7
        with:
          repository: lnkiai/m3e-canvas
          ref: main
          path: upstream
          fetch-depth: 0

      - name: Check upstream revision
        id: check
        shell: bash
        run: |
          upstream_sha="$(git -C upstream rev-parse HEAD)"
          current_sha="$(tr -d '[:space:]' < web-design/.github/upstream-revision)"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"

          git -C upstream cat-file -e "$current_sha^{commit}"

          if [ "$upstream_sha" = "$current_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "web-design already matches upstream revision $upstream_sha."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New upstream revision: $upstream_sha"
          fi

      - name: Reconcile upstream with fork changes
        if: steps.check.outputs.changed == 'true'
        working-directory: web-design
        shell: bash
        env:
          UPSTREAM_BASE: ${{ steps.check.outputs.current_sha }}
          UPSTREAM_HEAD: ${{ steps.check.outputs.upstream_sha }}
        run: |
          # Three-way merge retains local translations when upstream changes a nearby line.
          # Conflicts abort before commit; never overwrite fork changes silently.
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile

          root = pathlib.Path.cwd()
          upstream = root.parent / "upstream"
          old, new = os.environ["UPSTREAM_BASE"], os.environ["UPSTREAM_HEAD"]

          def git(*args):
              return subprocess.check_output(["git", "-C", str(upstream), *args])

          def blob(rev, path):
              return git("show", f"{rev}:{path}")

          diff = git("diff", "--name-status", "--no-renames", "-z", old, new, "--", ".",
                     ":(exclude).github/workflows/**", ":(top,exclude)README.md").split(b"\0")
          if diff[-1] == b"":
              diff.pop()
          if len(diff) % 2:
              raise RuntimeError("Unexpected upstream diff format")
          for i in range(0, len(diff), 2):
              status, rel = diff[i].decode(), diff[i + 1].decode()
              path = root / rel
              before = None if status == "A" else blob(old, rel)
              after = None if status == "D" else blob(new, rel)
              local = path.read_bytes() if path.is_file() else None
              if status == "A":
                  if local is not None and local != after:
                      raise RuntimeError(f"Conflict on new file {rel}")
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(after)
              elif status == "D":
                  if local != before:
                      raise RuntimeError(f"Conflict on deleted file {rel}")
                  path.unlink()
              elif status == "M":
                  if local is None:
                      raise RuntimeError(f"Missing modified file {rel}")
                  if local == before:
                      path.write_bytes(after)
                  elif local != after:
                      if any(b"\0" in value for value in (local, before, after)):
                          raise RuntimeError(f"Binary conflict {rel}")
                      with tempfile.TemporaryDirectory() as tmp:
                          files = [pathlib.Path(tmp, x) for x in ("ours", "base", "theirs")]
                          for name, value in zip(files, (local, before, after)):
                              name.write_bytes(value)
                          result = subprocess.run(
                              ["git", "merge-file", "-p", "-L", "fork", "-L", "base", "-L", "upstream",
                               *(str(name) for name in files)], capture_output=True,
                          )
                          if result.returncode:
                              sys.stderr.write(f"Merge conflict: {rel}. No commits made.\n")
                              sys.stderr.buffer.write(result.stdout)
                              sys.exit(1)
                          path.write_bytes(result.stdout)
              else:
                  raise RuntimeError(f"Unsupported upstream status {status}: {rel}")
              print(f"Applied upstream {status}: {rel}")
          PY
          npm pkg set name="web-design"
          npm pkg set repository.type="git"
          npm pkg set repository.url="https://github.com/nhwin304/web-design.git"
          npm pkg set homepage="https://nhwin304.github.io/web-design/"
          npm install --package-lock-only --ignore-scripts
          printf '%s\n' "$UPSTREAM_HEAD" > .github/upstream-revision

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        working-directory: web-design
        run: npm ci

      - name: Typecheck
        if: steps.check.outputs.changed == 'true'
        working-directory: web-design
        run: npm run typecheck

      - name: Test
        if: steps.check.outputs.changed == 'true'
        working-directory: web-design
        run: npm test

      - name: Build
        if: steps.check.outputs.changed == 'true'
        working-directory: web-design
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io

      - name: Commit synchronized source
        if: steps.check.outputs.changed == 'true'
        working-directory: web-design
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No source changes after synchronization."
          else
            git commit -m "chore: sync lnkiai/m3e-canvas@${{ steps.check.outputs.upstream_sha }}"
            git push origin HEAD:main
          fi

      - name: Deploy updated site
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
